openapi: 3.0.3
info:
  title: Carton Caps Referral API
  description: |
    This is a full technical description of the endpoints (backend API) for the referral app called
    Carton Caps. This definition serves double **purpose**: 1. for the backend to implement a clear goal,
    2. for the clients to know and understand how to use the api.
    In other words, this is a contract for the backend to implement and for the client (or frontend) to use.
  version: v1
servers:
- url: /api
  description: GA API base path
- url: /beta
  description: Staging experimental API base path
paths:
  /ping:
    get:
      tags:
      - Health
      summary: Is the API running?
      description: A simple endpoint to check the liveliness of the service.
      responses:
        "200":
          description: Service is running
          content:
            text/plain:
              schema:
                type: string
                example: pong
                enum:
                - pong
      servers:
      - url: /api
        description: Available in GA API only
  /referrals:
    get:
      tags:
      - Referrals
      summary: List All User Referrals
      description: "Returns the list of all referrals created by the current user,\
        \ paginated"
      parameters:
      - name: page
        in: query
        description: "Page to be loaded (example: page=1)"
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        description: "Number of elements per page (example: pageSize=15)"
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 25
      responses:
        "200":
          description: The list was returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200"
        "401":
          description: Unauthorized. User must be authenticated to view the referrals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - UserAuth: []
      servers:
      - url: /api
        description: Available in GA API only
    post:
      tags:
      - Referrals
      summary: Create a new deferred deep link
      description: |
        Creates a new referral association with the authenticated user referral code.
        Here a third-party service will be used to delegate the deep link data and final shareable URL. IMPORTANT: the endpoint should validate requests per minute or seconds for as a security measure for abuse control.
      responses:
        "201":
          description: Referral instance created sucessfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewReferralResponse"
        "401":
          description: Unauthorized. User must be authenticated to create a referral.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Too Many Requests. Rate limit exceeded, indicating a potential\
            \ abuse attempt."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - UserAuth: []
      servers:
      - url: /api
        description: Available in GA API only
  /referrals/{referralId}:
    get:
      tags:
      - Referrals
      summary: Get detailed referral status
      description: "Returns the detailed for the given ID, used to get the deep link\
        \ within the details"
      parameters:
      - name: referralId
        in: path
        description: The identifier of the referral to be viewed
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Successfully returned the referral details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referral"
        "401":
          description: Unauthorized. User must be authenticated to view the referral
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Forbidden, the authenticated user should not view this specific\
            \ referralId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found. There is no referral with the given ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - UserAuth: []
      servers:
      - url: /api
        description: Available in GA API only
  /referrals/events/installed:
    post:
      tags:
      - Referrals
      summary: Webhook to update the status to installed
      description: "When a customer shares the code, the third-party that handles\
        \ the deep \nlink will call this so that the status can change from pending\
        \ to installed.\n**Security Note:** Requires shared-secret validation\n"
      requestBody:
        description: "Deep-link third-party payload, that sould contains the tracking\
          \ ID"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/events_installed_body"
      responses:
        "204":
          description: Status is successfully updated.
        "404":
          description: Not found. there is not referral with the given tracking id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - SignatureAuth: []
      servers:
      - url: /api
        description: Available in GA API only
  /referrals/{referralId}/registered:
    post:
      tags:
      - Referrals
      summary: Update the status of a referral to registered
      description: |
        This is called by the internal registration services to update the status of a referral to
        registered. It uses the referralId rather than the tracking ID because this endpoint is to
        be used internally rather than externally.
      parameters:
      - name: referralId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          description: The referral identifier
          format: uuid
      requestBody:
        description: Leave empty
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        "204":
          description: Status successfully updated to REGISTERED.
        "404":
          description: Not found. There is no referral with the given ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - InternalApiKey: []
      servers:
      - url: /api
        description: Available in GA API only
  /referrals/{referralId}/rewarded:
    post:
      tags:
      - Referrals
      summary: Update status to rewarded
      description: |
        Called by the other micro service after the payment was processed.
      parameters:
      - name: referralId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          description: The referral's identifier
          format: uuid
      responses:
        "204":
          description: Status successfully updated to rewarded.
        "404":
          description: Not found. There is no referral with the given ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - InternalApiKey: []
      servers:
      - url: /api
        description: Available in GA API only
components:
  schemas:
    Referral:
      required:
      - referralCode
      - referralId
      - status
      type: object
      properties:
        referralId:
          type: string
          description: Identifier for each deep link
          format: uuid
        referralCode:
          type: string
          description: The code user's referral code
        dateCreated:
          type: string
          description: Generation date of the code
          format: date-time
        status:
          type: string
          description: Status of the referral process
          enum:
          - PENDING
          - INSTALLED
          - REGISTERED
          - REWARDED
        referredUserEmail:
          type: string
          description: Email of the referred person
          format: email
          nullable: true
        trackingId:
          type: string
          description: "unique identifier for the referral just for tracking the process\
            \ externally (for instance: deep link)"
          format: uuid
    NewReferralResponse:
      required:
      - referralId
      - shortUrl
      type: object
      properties:
        referralId:
          $ref: "#/components/schemas/Referral/properties/referralId"
        trackingId:
          type: string
          description: The tracking id generated by the client.
          format: Guid
    Error:
      required:
      - errorCode
      - message
      type: object
      properties:
        errorCode:
          type: string
          description: "An error code more intended for machines of the specific error\
            \ (for instance UNAUTH, NOT_FOUND)."
        message:
          type: string
          description: A human friendly description of the error for either UI or
            logging purposes.
    inline_response_200:
      required:
      - items
      type: object
      properties:
        totalCount:
          type: integer
        currentPage:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Referral"
    events_installed_body:
      required:
      - trackingId
      type: object
      properties:
        trackingId:
          type: string
          description: tracking id used to link the newly installed account to update
            the referral status
          format: uuid
  securitySchemes:
    UserAuth:
      type: http
      description: Bearer token provided by another microservice in the organization
      scheme: bearer
      bearerFormat: JWT
    SignatureAuth:
      type: apiKey
      description: |
        Authentication is done using Hash-based Message Authentication Code signature verification.
        The client encrypts or sings the body of the request , and the signature is sent in the header.
      name: X-Signature
      in: header
    InternalApiKey:
      type: apiKey
      description: Internal microservices communication key
      name: X-Internal-Key
      in: header
