openapi: 3.0.0
info:
  title: Carton Caps Referral API
  description: |
    This is a full technical description of the endpoints (backend API) for the referral app called
    Carton Caps. This definition serves double purpose: 1. for the backend to implement a clear goal, 2. for the clients to know and understand how to use the api.
    In other words, this is a contract for the backend to implement and for the client (or frontend) to use.
  version: v1
servers:
- url: /api
  description: GA API base path
- url: /beta
  description: Staging experimental API base path
paths:
  /ping:
    get:
      tags:
      - Health
      summary: Is the API running?
      description: A simple endpoint to check the liveliness of the service.
      responses:
        "200":
          description: Service is running
          content:
            text/plain:
              schema:
                type: string
                example: pong
                enum:
                - pong
      servers:
      - url: /api
        description: Available in GA API only
components:
  schemas:
    Referral:
      required:
      - referralCode
      - referralId
      - status
      type: object
      properties:
        referralId:
          type: string
          description: identifier for each deep link
          format: uuid
        referralCode:
          type: string
          description: the code user's referral code
        dateCreated:
          type: string
          description: generation date of the code
          format: date-time
        status:
          type: string
          description: status of the referral process
          enum:
          - PENDING
          - INSTALLED
          - REGISTERED
          - REWARDED
        referredUserEmail:
          type: string
          description: email of the referred person
          format: email
          nullable: true
    NewReferralResponse:
      required:
      - referralId
      - shortUrl
      type: object
      properties:
        referralId:
          $ref: "#/components/schemas/Referral/properties/referralId"
        shortUrl:
          type: string
          description: shareable deferred deep link URL to be sent to the referred
            user
          format: url
        deepLinkPayload:
          type: string
          description: third party specific payload needed by the app to get the shareable
            link
    Error:
      required:
      - errorCode
      - message
      type: object
      properties:
        errorCode:
          type: string
          description: "an error code more intended for machines of the specific error\
            \ (for instance UNAUTH, NOT_FOUND)."
        message:
          type: string
          description: A human friendly description of the error for either UI or
            logging purposes.
